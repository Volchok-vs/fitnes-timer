<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Графітова темна тема */
        body {
            background-color: #1e222b;
            color: #f1f3f5;
        }

        .card {
            background-color: #282c37;
            border: 1px solid #3e4451;
            color: #f1f3f5;
        }

        .form-control,
        .form-control:focus {
            background-color: #1e222b;
            border-color: #4b5263;
            color: #fff;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        /* СТИЛІЗАЦІЯ КРУГОВОГО ТАЙМЕРА */
        .timer-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }

        .timer-svg {
            transform: rotate(-90deg);
            /* Повертаємо, щоб відлік починався зверху */
            width: 100%;
            height: 100%;
        }

        .timer-bg-circle {
            fill: none;
            stroke: #1e222b;
            stroke-width: 12;
        }

        .timer-progress-circle {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
            /* Довжина кола = 2 * PI * r (2 * 3.14159 * 120 = ~754) */
            stroke-dasharray: 754;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
        }

        .timer-text-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .timer-display {
            font-size: 4.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        /* Кольори для різних станів */
        .circle-work {
            stroke: #98c379;
        }

        /* Зелений */
        .circle-pause {
            stroke: #e5c07b;
        }

        /* Жовтий */
        .circle-break {
            stroke: #e06c75;
        }

        /* Червоний */

        /* Стилізація нижнього меню */
        .nav-pills .nav-link {
            color: #a0aec0;
            border-radius: 10px;
        }

        .nav-pills .nav-link.active {
            background-color: #3b82f6;
            color: #fff;
        }

        /* Робимо приглушений текст читабельним на темному тлі */
        .text-muted {
            color: #a0aec0 !important;
            /* Світліший сіро-сріблястий колір */
        }

        /* Окремо підсвітимо дрібні підписи в калькуляторі та налаштуваннях */
        .form-label,
        .input-group-text {
            color: #cbd5e1;
            /* Приємний світлий відтінок */
        }
    </style>
</head>

<body>

    <div class="container py-3 d-flex flex-column justify-content-between" style="max-width: 500px; min-height: 95vh;">

        <div class="tab-content flex-grow-1 mb-4">

            <div class="tab-pane fade show active" id="pills-setup" role="tabpanel">
                <div class="card shadow h-100">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Налаштування вправ</h5>
                    </div>
                    <div class="card-body">

                        <h6 class="text-muted mb-3">Час на кожну вправу:</h6>
                        <div class="mb-4">
                            <div class="row g-2 align-items-center mb-2">
                                <div class="col-7"><span class="text-white">1. Скакалка</span></div>
                                <div class="col-5">
                                    <div class="input-group input-group-sm">
                                        <input type="number" id="timeEx1" class="form-control text-center" value="45">
                                        <span class="input-group-text bg-secondary text-white">сек</span>
                                    </div>
                                </div>
                            </div>
                            <div class="row g-2 align-items-center mb-2">
                                <div class="col-7"><span class="text-white">2. Присідання</span></div>
                                <div class="col-5">
                                    <div class="input-group input-group-sm">
                                        <input type="number" id="timeEx2" class="form-control text-center" value="30">
                                        <span class="input-group-text bg-secondary text-white">сек</span>
                                    </div>
                                </div>
                            </div>
                            <div class="row g-2 align-items-center mb-2">
                                <div class="col-7"><span class="text-white">3. Полегшені віджимання</span></div>
                                <div class="col-5">
                                    <div class="input-group input-group-sm">
                                        <input type="number" id="timeEx3" class="form-control text-center" value="30">
                                        <span class="input-group-text bg-secondary text-white">сек</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="border-secondary">

                        <h6 class="text-muted mb-3">Паузи та Раунди:</h6>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label small text-muted">Між вправами:</label>
                                <input type="number" id="inputRestBetween" class="form-control" value="10">
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted">Між колами:</label>
                                <input type="number" id="inputCycleRest" class="form-control" value="45">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small text-muted">Кількість кіл:</label>
                            <input type="number" id="inputCycles" class="form-control" value="4">
                        </div>

                        <div class="p-3 rounded text-center"
                            style="background-color: #1e222b; border: 1px dashed #4b5263;">
                            <div class="small text-muted">Загальний час комплексу</div>
                            <div class="fs-3 text-info fw-bold"><span id="calcTotalTime">0.0</span> хв</div>
                            <div class="text-muted small">Одне коло: <span id="calcCycleTime">0</span> сек</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="pills-sounds" role="tabpanel">
                <div class="card shadow h-100">
                    <div class="card-header bg-dark text-white">
                        <h5>Налаштування звуків</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label text-muted">Гучність (всі сигнали):</label>
                            <input type="range" class="form-range" id="soundVol" min="0.1" max="1" step="0.1"
                                value="0.6">
                        </div>
                        <hr class="border-secondary">
                        <div class="mb-3">
                            <label class="form-label">Частота (Тон), Гц:</label>
                            <input type="range" class="form-range" id="soundFreq" min="200" max="1200" step="50"
                                value="600">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Тривалість сигналу, сек:</label>
                            <input type="range" class="form-range" id="soundDur" min="0.1" max="1" step="0.1"
                                value="0.3">
                        </div>
                        <button class="btn btn-outline-info w-100" onclick="testSound()">ПЕРЕВІРИТИ ЗВУК</button>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="pills-timer" role="tabpanel">
                <div class="card shadow text-center h-100 d-flex flex-column justify-content-between py-4">
                    <div class="card-body d-flex flex-column justify-content-between">

                        <div>
                            <span class="badge bg-primary px-3 py-2 fs-6 mb-3">Коло: <span
                                    id="currentCycleDisplay">1</span> / <span id="totalCyclesDisplay">4</span></span>
                            <div class="text-uppercase fw-bold small mb-1" id="statusLabel">Готовий</div>
                            <div class="text-white h4 fw-bold px-2 mb-4" id="currentExerciseLabel">Натисніть СТАРТ</div>
                        </div>

                        <div class="timer-container my-3">
                            <svg class="timer-svg" viewBox="0 0 260 260">
                                <circle class="timer-bg-circle" cx="130" cy="130" r="120"></circle>
                                <circle id="progressCircle" class="timer-progress-circle circle-work" cx="130" cy="130"
                                    r="120"></circle>
                            </svg>
                            <div class="timer-text-box">
                                <div class="timer-display text-white" id="timerDisplay">00:00</div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button id="btnStart" class="btn btn-success btn-lg w-100 fw-bold py-3 shadow">СТАРТ
                                ТРЕНУВАННЯ</button>
                        </div>

                    </div>
                </div>
            </div>

        </div>

        <div class="card p-2 shadow-lg">
            <ul class="nav nav-pills nav-fill" id="pills-tab" role="tablist">
                <li class="nav-item"><button class="nav-link active" id="tab-setup" data-bs-toggle="pill"
                        data-bs-target="#pills-setup" type="button">⚙️ Вправи</button></li>
                <li class="nav-item"><button class="nav-link" id="tab-sounds" data-bs-toggle="pill"
                        data-bs-target="#pills-sounds" type="button">🔊 Звуки</button></li>
                <li class="nav-item"><button class="nav-link" id="tab-timer" data-bs-toggle="pill"
                        data-bs-target="#pills-timer" type="button">⏱️ Таймер</button></li>
            </ul>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Функція, яка бере значення з наших нових повзунків
        function getSoundSettings() {
            return {
                freq: parseFloat(document.getElementById('soundFreq')?.value) || 600,
                dur: parseFloat(document.getElementById('soundDur')?.value) || 0.3,
                vol: parseFloat(document.getElementById('soundVol')?.value) || 0.6
            };
        }

        function playTone(freq, duration, volume) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle'; // Об'ємний звук
            osc.frequency.value = freq;

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Тепер звуки динамічно підлаштовуються під те, що ти виставив у вкладці "Звуки"
        const sounds = {
            midpoint: () => {
                const s = getSoundSettings();
                playTone(s.freq * 0.7, s.dur, s.vol); // Трохи нижчий тон для середини
            },
            countdown: () => {
                const s = getSoundSettings();
                playTone(s.freq, s.dur * 0.5, s.vol); // Коротший сигнал для відліку
            },
            exerciseEnd: () => {
                const s = getSoundSettings();
                playTone(s.freq * 1.2, s.dur * 1.5, s.vol); // Вищий тон для зміни вправи
            },
            cycleEnd: () => {
                const s = getSoundSettings();
                playTone(s.freq * 1.5, s.dur * 2, s.vol); // Потужний довгий сигнал
                setTimeout(() => playTone(s.freq * 1.5, s.dur * 2, s.vol), 400);
            }
        };

        
        // --- DOM ELEMENTS ---
        const timeEx1 = document.getElementById('timeEx1');
        const timeEx2 = document.getElementById('timeEx2');
        const timeEx3 = document.getElementById('timeEx3');
        const inputRestBetween = document.getElementById('inputRestBetween');
        const inputCycleRest = document.getElementById('inputCycleRest');
        const inputCycles = document.getElementById('inputCycles');

        const calcCycleTime = document.getElementById('calcCycleTime');
        const calcTotalTime = document.getElementById('calcTotalTime');

        const timerDisplay = document.getElementById('timerDisplay');
        const statusLabel = document.getElementById('statusLabel');
        const currentExerciseLabel = document.getElementById('currentExerciseLabel');
        const currentCycleDisplay = document.getElementById('currentCycleDisplay');
        const totalCyclesDisplay = document.getElementById('totalCyclesDisplay');
        const progressCircle = document.getElementById('progressCircle');
        const btnStart = document.getElementById('btnStart');

        const MAX_CIRCUMFERENCE = 754; // 2 * Math.PI * 120

        // --- LOCAL STORAGE ---
        function loadSettings() {
            const saved = localStorage.getItem('workout_timer_settings');
            if (saved) {
                const data = JSON.parse(saved);
                timeEx1.value = data.t1 ?? 45;
                timeEx2.value = data.t2 ?? 30;
                timeEx3.value = data.t3 ?? 30;
                inputRestBetween.value = data.restBetween ?? 10;
                inputCycleRest.value = data.cycleRest ?? 45;
                inputCycles.value = data.cycles ?? 4;

                // Додай ці три рядки:
                if (data.soundFreq) document.getElementById('soundFreq').value = data.soundFreq;
                if (data.soundDur) document.getElementById('soundDur').value = data.soundDur;
                if (data.soundVol) document.getElementById('soundVol').value = data.soundVol;
            }
        }

        function saveSettings() {
            const data = {
                t1: parseInt(timeEx1.value) || 0,
                t2: parseInt(timeEx2.value) || 0,
                t3: parseInt(timeEx3.value) || 0,
                restBetween: parseInt(inputRestBetween.value) || 0,
                cycleRest: parseInt(inputCycleRest.value) || 0,
                cycles: parseInt(inputCycles.value) || 1,
                // Додай ці три рядки:
                soundFreq: document.getElementById('soundFreq').value,
                soundDur: document.getElementById('soundDur').value,
                soundVol: document.getElementById('soundVol').value
            };
            localStorage.setItem('workout_timer_settings', JSON.stringify(data));
        }

        document.querySelectorAll('input[type="range"]').forEach(input => {
            input.addEventListener('input', saveSettings);
        });


        // --- CALCULATION ---
        function updateCalculator() {
            const t1 = parseInt(timeEx1.value) || 0;
            const t2 = parseInt(timeEx2.value) || 0;
            const t3 = parseInt(timeEx3.value) || 0;
            const restBetween = parseInt(inputRestBetween.value) || 0;
            const cycleRest = parseInt(inputCycleRest.value) || 0;
            const cycles = parseInt(inputCycles.value) || 1;

            const oneCycleTime = t1 + t2 + t3 + (restBetween * 2);
            const totalSeconds = (oneCycleTime * cycles) + (cycleRest * (cycles - 1));

            calcCycleTime.innerText = oneCycleTime;
            calcTotalTime.innerText = (totalSeconds / 60).toFixed(1);
            totalCyclesDisplay.innerText = cycles;

            saveSettings();
        }

        [timeEx1, timeEx2, timeEx3, inputRestBetween, inputCycleRest, inputCycles].forEach(el => {
            el.addEventListener('input', updateCalculator);
        });

        // --- TIMER ENGINE ---
        let mainInterval = null;
        let queue = [];
        let queueIndex = 0;
        let currentSeconds = 0;
        let initialDuration = 0;
        let isRunning = false;

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Функція оновлення кругової лінії
        function setCircleProgress(percent) {
            const offset = MAX_CIRCUMFERENCE - (percent / 100) * MAX_CIRCUMFERENCE;
            progressCircle.style.strokeDashoffset = offset;
        }

        function runNextStep() {
            if (queueIndex >= queue.length) {
                sounds.cycleEnd();
                clearInterval(mainInterval);
                statusLabel.innerText = "ФІНІШ!";
                statusLabel.className = "text-uppercase fw-bold text-info small mb-1";
                currentExerciseLabel.innerText = "Комплекс виконано!";
                timerDisplay.innerText = "00:00";
                setCircleProgress(100);
                resetUI();
                return;
            }

            const currentStep = queue[queueIndex];
            currentSeconds = currentStep.duration;
            initialDuration = currentSeconds;

            currentCycleDisplay.innerText = currentStep.cycle;
            currentExerciseLabel.innerText = currentStep.name;

            // Встановлюємо правильні кольори та класи для круга
            progressCircle.removeAttribute('class');
            progressCircle.classList.add('timer-progress-circle');

            if (currentStep.type === 'work') {
                statusLabel.innerText = "ПРАЦЮЙ!";
                statusLabel.className = "text-uppercase fw-bold text-success small mb-1";
                progressCircle.classList.add('circle-work');
                setCircleProgress(100); // Починаємо з повного кола
            } else if (currentStep.type === 'pause') {
                statusLabel.innerText = "ПЕРЕХІД";
                statusLabel.className = "text-uppercase fw-bold text-warning small mb-1";
                progressCircle.classList.add('circle-pause');
                setCircleProgress(0); // Починаємо з порожнього кола для заповнення назад
            } else {
                statusLabel.innerText = "ВІДПОЧИНОК";
                statusLabel.className = "text-uppercase fw-bold text-danger small mb-1";
                progressCircle.classList.add('circle-break');
                setCircleProgress(0); // Починаємо з порожнього кола
            }

            timerDisplay.innerText = formatTime(currentSeconds);
            const midPoint = Math.floor(initialDuration / 2);

            clearInterval(mainInterval);
            mainInterval = setInterval(() => {
                currentSeconds--;
                timerDisplay.innerText = formatTime(currentSeconds);

                // Розраховуємо відсоток часу, який МИНУВ або ЗАЛИШИВСЯ
                let percent;
                if (currentStep.type === 'work') {
                    // Зменшується від 100 до 0
                    percent = (currentSeconds / initialDuration) * 100;
                } else {
                    // Заповнюється назад від 0 до 100
                    percent = ((initialDuration - currentSeconds) / initialDuration) * 100;
                }
                setCircleProgress(percent);

                // Звук на середині вправи
                if (currentSeconds === midPoint && currentStep.type === 'work' && initialDuration > 10) {
                    sounds.midpoint();
                }

                // Пикання на останніх секундах
                if (currentSeconds <= 3 && currentSeconds > 0) {
                    sounds.countdown();
                }

                if (currentSeconds <= 0) {
                    clearInterval(mainInterval);
                    queueIndex++;

                    if (currentStep.type === 'work' && queue[queueIndex] && queue[queueIndex].type === 'break') {
                        sounds.cycleEnd();
                    } else {
                        sounds.exerciseEnd();
                    }

                    runNextStep();
                }
            }, 1000);
        }

        function buildQueue() {
            queue = [];
            const cycles = parseInt(inputCycles.value) || 1;
            const restBetween = parseInt(inputRestBetween.value) || 0;
            const cycleRest = parseInt(inputCycleRest.value) || 0;

            const exercises = [
                { name: "1. Скакалка", duration: parseInt(timeEx1.value) || 0 },
                { name: "2. Присідання", duration: parseInt(timeEx2.value) || 0 },
                { name: "3. Полегшені віджимання", duration: parseInt(timeEx3.value) || 0 }
            ];

            for (let c = 1; c <= cycles; c++) {
                for (let i = 0; i < exercises.length; i++) {
                    if (exercises[i].duration > 0) {
                        queue.push({
                            cycle: c,
                            name: exercises[i].name,
                            duration: exercises[i].duration,
                            type: 'work'
                        });
                    }

                    if (i < exercises.length - 1 && restBetween > 0) {
                        queue.push({
                            cycle: c,
                            name: `Приготуватися: ${exercises[i + 1].name}`,
                            duration: restBetween,
                            type: 'pause'
                        });
                    }
                }

                if (c < cycles && cycleRest > 0) {
                    queue.push({
                        cycle: c,
                        name: "Відпочинок / Вода",
                        duration: cycleRest,
                        type: 'break'
                    });
                }
            }
        }

        function resetUI() {
            isRunning = false;
            btnStart.innerText = "СТАРТ ТРЕНУВАННЯ";
            btnStart.className = "btn btn-success btn-lg w-100 fw-bold py-3";
        }

        btnStart.addEventListener('click', () => {
            if (isRunning) {
                clearInterval(mainInterval);
                resetUI();
                statusLabel.innerText = "ЗУПИНЕНО";
                statusLabel.className = "text-uppercase fw-bold text-muted small mb-1";
                currentExerciseLabel.innerText = "Натисніть СТАРТ";
                timerDisplay.innerText = "00:00";
                setCircleProgress(100);
                return;
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            buildQueue();
            if (queue.length === 0) return;

            isRunning = true;
            btnStart.innerText = "СТОП / СКИДАННЯ";
            btnStart.className = "btn btn-danger btn-lg w-100 fw-bold py-3";
            queueIndex = 0;

            runNextStep();
        });

        // Запуск
        loadSettings();
        updateCalculator();
        setCircleProgress(100);
    </script>

</body>

</html>
